[workspace]
resolver = "2"
members = [
    "decodering-core",
    "decodering-cli",
    "decodering-server",
    "decodering-raft",
    "decodering-db",
    "decodering-plugins/openbao-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
decodering-core = { path = "decodering-core" }
decodering-raft = { path = "decodering-raft" }
decodering-db = { path = "decodering-db" }
decodering-plugins = { path = "decodering-plugins" }

serde_with = { version = "3.19.0", features = ["base64", "macros"] }
# Targeting a specific rusqlite version to match the same libsqlite3-sys version used by sqlx
# Using backup API to install a new snapshot. Not supported by sqlx 0.8.x.
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }

serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["full"] }
extism = "1.21.0"
serde_yaml = "0.9"
dotenvy = "0.15.7"
actix-web = "4.13.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "json",
    "registry",
    "env-filter",
    "std",
] }
tracing-actix-web = "0.7.21"
actix-cors = "0.7.1"
futures-util = "0.3.32"
openraft = { version = "0.10.0-alpha.18", features = ["serde", "type-alias"] }
rocksdb = "0.24.0"
futures = "0.3.32"
rand = { version = "0.10.1", features = ["thread_rng"] }
reqwest = { version = "0.13.3", features = ["json"] }
clap = "4.6.1"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "postgres",
] }
blahaj = "0.6"
sha2 = "0.11.0"
base64 = "0.22.1"
zeroize = "1.8.2"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_lossless = "warn"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
exit = "deny"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

print_stdout = "warn"  # use logging instead
print_stderr = "warn"
use_debug = "warn"  # {:?} in user-facing output
string_to_string = "warn"
string_slice = "warn"
str_to_string = "warn"
verbose_file_reads = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"

[workspace.lints.rust]
unused_extern_crates = "warn"
