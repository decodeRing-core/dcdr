[workspace]
resolver = "2"
members = [
    "decodering-core",
    "decodering-cli",
    "decodering-server",
    "decodering-raft",
    "decodering-db",
    "decodering-plugins/openbao-rs",
    "decodering-plugins/aws-rs",
    "decodering-auth",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
decodering-core = { path = "decodering-core" }
decodering-raft = { path = "decodering-raft" }
decodering-db = { path = "decodering-db" }
decodering-auth = { path = "decodering-auth" }

serde_with = { version = "3.21.0", features = ["base64", "macros"] }
# Targeting a specific rusqlite version to match the same libsqlite3-sys version used by sqlx
# Using backup API to install a new snapshot.
rusqlite = { version = "~0.39.0", features = ["bundled", "backup"] }

tokio = { version = "1.52.3", features = ["full"] }
serde = "1.0.228"
serde_json = { version = "1.0.150", features = ["preserve_order"] }
extism = "1.30.0"
serde_norway = "0.9.42"
dotenvy = "0.15.7"
actix-web = "4.13.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "json",
    "registry",
    "env-filter",
    "std",
] }
tracing-actix-web = "0.7.21"
actix-cors = "0.7.1"
futures-util = "0.3.32"
openraft = { version = "0.10.0-alpha.20", features = ["serde", "type-alias"] }
rocksdb = "0.24.0"
futures = "0.3.32"
rand = { version = "0.10.1", features = ["thread_rng"] }
reqwest = { version = "0.13.4", features = ["json"] }
clap = { version = "4.6.1", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "postgres",
] }
blahaj = { version = "0.6", features = ["default"] }
# Pin to sync with rsa
sha2 = { version = "~0.10.9", features = ["oid"] }
base64 = "0.22.1"
zeroize = { version = "1.8.2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
pem = "3.0.6"
x509-parser = "0.18.1"
rustls-webpki = { version = "0.103.13", features = ["alloc", "std", "ring"] }
rustls-pki-types = "1.14"
rsa = "0.9.10"
p256 = { version = "0.13", features = ["ecdsa"] }
schemars = "1.2.1"
actix-http = "3.12.1"
aes-gcm = "0.10"
hmac = "~0.12.1"
cfb-mode = "0.9.1"
aes = "0.9.1"
constant_time_eq = "0.5.0"
aws-config = { version = "1.8.18", features = ["credentials-login"] }
aws-sigv4 = "1.4.5"
aws-credential-types = { version = "1.2.14", features = [] }
async-trait = "0.1.89"
utoipa = { version = "5.5.0", features = ["preserve_order"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
metrics = "0.24"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_lossless = "warn"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
exit = "deny"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
implicit_hasher = "allow"
future_not_send = "allow"

print_stdout = "warn"       # use logging instead
print_stderr = "warn"
use_debug = "warn"          # {:?} in user-facing output
implicit_clone = "warn"
string_slice = "warn"
str_to_string = "warn"
verbose_file_reads = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
too_many_lines = "allow"

[workspace.lints.rust]
unused_extern_crates = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
