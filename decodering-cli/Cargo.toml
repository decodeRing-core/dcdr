[package]
name = "decodering-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
tpm = ["dep:tss-esapi"]

[dependencies]
decodering-core.workspace = true

clap.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
aws-config.workspace = true
aws-sigv4.workspace = true
aws-credential-types.workspace = true
serde.workspace = true
base64.workspace = true
rsa.workspace = true

keyring-core = { version = "1.0.0" }
tss-esapi = { version = "~7.5", optional = true }
hex = "0.4"
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1"

[lints]
workspace = true
