[package]
name = "decodering-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
tpm = ["dep:tss-esapi"]
aws = ["dep:aws-sigv4", "dep:aws-config", "dep:aws-credential-types"]

[dependencies]
decodering-core.workspace = true

clap.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
base64.workspace = true
rsa.workspace = true

aws-config = { version = "1.8.18", features = [
    "credentials-login",
], optional = true }
aws-sigv4 = { version = "1.4.5", optional = true }
aws-credential-types = { version = "1.2.14", features = [], optional = true }

keyring-core = { version = "1.0.0" }
tss-esapi = { version = "~7.5", optional = true }
hex = "0.4"
dirs = "6.0.0"
indicatif = "0.18.4"
console = "0.16.3"
cliclack = "0.5"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
    "rt-tokio-crypto-rust",
] }


[lints]
workspace = true
